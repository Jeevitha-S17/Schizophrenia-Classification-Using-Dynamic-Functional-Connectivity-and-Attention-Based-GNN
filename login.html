{% extends "base.html" %}

{% block title %}Login - Schizophrenia DFC Predictor{% endblock %}

{% block extra_css %}
<style>
    .auth-wrapper {
        min-height: calc(100vh - 72px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        background: linear-gradient(135deg, #0a0e1a 0%, #1a1a2e 50%, #16213e 100%);
        position: relative;
        overflow: hidden;
        margin-left: calc(-50vw + 50%);
        margin-right: calc(-50vw + 50%);
        width: 100vw;
    }
    
    .auth-wrapper::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at 30% 40%, rgba(59, 130, 246, 0.05) 0%, transparent 70%),
                    radial-gradient(circle at 70% 60%, rgba(99, 102, 241, 0.03) 0%, transparent 60%);
        animation: authShimmer 10s ease-in-out infinite;
    }
    
    @keyframes authShimmer {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(5%, 3%) rotate(2deg); }
    }
    
    .auth-container {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 420px;
    }
    
    .auth-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        padding: 2.5rem 2.5rem 2rem;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        animation: fadeInUp 0.6s ease-out;
    }
    
    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .auth-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(99, 102, 241, 0.2));
        border: 1px solid rgba(59, 130, 246, 0.2);
        margin-bottom: 1rem;
        font-size: 2rem;
    }
    
    .auth-card h2 {
        font-size: 1.75rem;
        font-weight: 700;
        color: #fff;
        margin: 0;
        letter-spacing: -0.5px;
    }
    
    .auth-subtitle {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.9rem;
        margin-top: 0.25rem;
    }
    
    .form-group {
        margin-bottom: 1.25rem;
    }
    
    .form-group label {
        display: block;
        font-weight: 500;
        margin-bottom: 0.375rem;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.8);
    }
    
    .form-group input {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        font-size: 0.95rem;
        transition: all 0.3s ease;
        font-family: inherit;
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
    }
    
    .form-group input::placeholder {
        color: rgba(255, 255, 255, 0.3);
    }
    
    .form-group input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        background: rgba(255, 255, 255, 0.08);
    }
    
    .form-group input:focus + .input-icon {
        color: #3b82f6;
    }
    
    .input-wrapper {
        position: relative;
    }
    
    .input-wrapper input {
        padding-left: 2.75rem;
    }
    
    .input-icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.3);
        transition: color 0.3s ease;
        pointer-events: none;
    }
    
    .input-icon svg {
        width: 18px;
        height: 18px;
    }
    
    .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
    }
    
    .form-options label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.85rem;
        cursor: pointer;
    }
    
    .form-options label input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: #3b82f6;
        cursor: pointer;
    }
    
    .forgot-link {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.85rem;
        text-decoration: none;
        transition: color 0.3s ease;
    }
    
    .forgot-link:hover {
        color: #60a5fa;
    }
    
    .btn-primary {
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        color: white;
        padding: 0.875rem;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        width: 100%;
        position: relative;
        overflow: hidden;
    }
    
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(59, 130, 246, 0.4);
    }
    
    .btn-primary:active {
        transform: translateY(0);
    }
    
    .btn-primary .btn-content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }
    
    .btn-primary .btn-content svg {
        width: 20px;
        height: 20px;
    }
    
    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    
    .auth-footer p {
        color: rgba(255, 255, 255, 0.4);
        font-size: 0.9rem;
        margin: 0;
    }
    
    .auth-footer a {
        color: #60a5fa;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s ease;
    }
    
    .auth-footer a:hover {
        color: #93bbfc;
        text-decoration: underline;
    }
    
    /* Floating particles */
    .auth-particles {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
    }
    
    .particle {
        position: absolute;
        border-radius: 50%;
        background: rgba(59, 130, 246, 0.1);
        animation: floatParticle 15s infinite;
    }
    
    .particle:nth-child(1) {
        width: 80px;
        height: 80px;
        top: 10%;
        left: 5%;
        animation-delay: 0s;
        animation-duration: 18s;
    }
    
    .particle:nth-child(2) {
        width: 120px;
        height: 120px;
        bottom: 15%;
        right: 5%;
        animation-delay: -3s;
        animation-duration: 22s;
        background: rgba(99, 102, 241, 0.08);
    }
    
    .particle:nth-child(3) {
        width: 60px;
        height: 60px;
        top: 50%;
        left: 90%;
        animation-delay: -6s;
        animation-duration: 16s;
        background: rgba(59, 130, 246, 0.06);
    }
    
    .particle:nth-child(4) {
        width: 100px;
        height: 100px;
        bottom: 30%;
        left: 10%;
        animation-delay: -9s;
        animation-duration: 20s;
        background: rgba(99, 102, 241, 0.05);
    }
    
    @keyframes floatParticle {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
        25% { transform: translate(30px, -40px) scale(1.2); opacity: 0.6; }
        50% { transform: translate(-20px, -80px) scale(0.8); opacity: 0.2; }
        75% { transform: translate(40px, -30px) scale(1.1); opacity: 0.5; }
    }
    
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    /* Responsive */
    @media (max-width: 480px) {
        .auth-card {
            padding: 1.75rem 1.5rem 1.5rem;
        }
        
        .auth-card h2 {
            font-size: 1.5rem;
        }
        
        .form-options {
            flex-direction: column;
            gap: 0.5rem;
            align-items: flex-start;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <!-- Floating Particles -->
    <div class="auth-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">🔐</div>
                <h2>Welcome Back</h2>
                <p class="auth-subtitle">Sign in to access the DFC Predictor</p>
            </div>
            
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                        </span>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0110 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>
                
                
                
                <button type="submit" class="btn-primary">
                    <span class="btn-content">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/>
                        </svg>
                        Sign In
                    </span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="{{ url_for('register') }}">Create one now</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
